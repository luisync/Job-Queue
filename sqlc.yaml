version: "2"
sql:
  - engine: "postgresql"
    queries: "./internal/jobqueue-grpc/adapters/postgresql/sqlc/queries.sql"
    schema: "./internal/jobqueue-grpc/adapters/postgresql/migrations"
    gen:
      go:
        package: "repo"
        out: "./internal/jobqueue-grpc/adapters/postgresql/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true # generates a querier interface
        overrides:
          - column: "sessions.expires_at"
            go_type: "time.Time"
          - column: "sessions.created_at"
            go_type: "time.Time"