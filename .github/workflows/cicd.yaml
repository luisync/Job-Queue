name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

permissions:
  id-token: write
  contents: read

jobs:
  # Set up the databases and run the application.
  test:
    name: Run Tests and Linting
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: POSTGRES_USER:-postgres
          POSTGRES_PASSWORD: POSTGRES_PASSWORD:-postgres
          POSTGRES_DB: POSTGRES_DB:-jobs-queue
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true
      
      - name: Install dependencies
        run: go mod download

      - name: Run Go tests
        run: go test -v ./...
      
  build-and-push-images:
    name: Verify Docker images can be built
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          build-args: TARGET_CMD=jobqueue-api
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: | 
            ${{ secrets.DOCKERHUB_USERNAME }}/jobqueue-api:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/jobqueue-api:latest
      
      - name: Build and push gRPC image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          build-args: TARGET_CMD=jobqueue-grpc
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: | 
            ${{ secrets.DOCKERHUB_USERNAME }}/jobqueue-grpc:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/jobqueue-grpc:latest
      
      - name: Build and push Worker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          build-args: TARGET_CMD=jobqueue-worker
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: | 
            ${{ secrets.DOCKERHUB_USERNAME }}/jobqueue-worker:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/jobqueue-worker:latest
      
      # Build prewarmed images.
      - name: Build and push prewarmed Python image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./DockerFile.python-prewarmed
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: | 
            ${{ secrets.DOCKERHUB_USERNAME }}/jobqueue-python-runner:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/jobqueue-python-runner:latest
      
      - name: Build and push prewarmed Node image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./DockerFile.node-prewarmed
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: | 
            ${{ secrets.DOCKERHUB_USERNAME }}/jobqueue-node-runner:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/jobqueue-node-runner:latest

  # Deploy images to Kubernetes instance running on the cloud.
  deploy:
    name: Deploy images to Kubernetes Cluster
    runs-on: ubuntu-latest
    needs: build-and-push-images
    if: github.ref == 'refs/heads/main' # Only run on pushes.

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Connect to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-north-1
      
      - name: Set up connection to Kubernetes Cluster
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_DATA }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config


      - name: Send Docker images to Kubernetes Cluster
        run: |
          kubectl set image deployment/jobqueue-api api=${{ secrets.DOCKERHUB_USERNAME }}/jobqueue-api:${{ github.sha }}
          kubectl set image deployment/jobqueue-grpc grpc=${{ secrets.DOCKERHUB_USERNAME }}/jobqueue-grpc:${{ github.sha }}
          kubectl set image deployment/jobqueue-worker worker=${{ secrets.DOCKERHUB_USERNAME }}/jobqueue-worker:${{ github.sha }}
          kubectl rollout status deployment/jobqueue-api

